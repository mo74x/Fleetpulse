apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetpulse-api
  labels:
    app: fleetpulse
spec:
  replicas: 3 # Start with 3 instances for high availability
  selector:
    matchLabels:
      app: fleetpulse
  template:
    metadata:
      labels:
        app: fleetpulse
    spec:
      containers:
      - name: fleetpulse-api
        image: your-docker-registry/fleetpulse:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        # Resource limits prevent a single pod from crashing the cluster
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Environment variables should ideally reference Kubernetes Secrets in production
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: fleetpulse-secrets
              key: MONGO_URI
        # Readiness probe ensures traffic is only sent to fully booted pods
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fleetpulse-service
spec:
  type: ClusterIP
  selector:
    app: fleetpulse
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000